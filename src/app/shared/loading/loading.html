<div class="box-loading-overlay" [class.hidden]="!isVisible">
  <div class="box-loading-content">

    <div class="box-loading-badge">
      <img src="assets/logo-icon.png" alt="" class="box-loading-icon" />
      <svg class="box-loading-ring" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="44"/>
      </svg>
    </div>

    <div class="box-loading-brand">Box.academy</div>

    <div class="box-loading-status">
      <span>Chargement</span>
      <span class="box-dots">
        <span class="box-dot box-dot-1"></span>
        <span class="box-dot box-dot-2"></span>
        <span class="box-dot box-dot-3"></span>
      </span>
    </div>

  </div>
</div>
