<div class="connexion-page">
  <div class="connexion-card">

    <button type="button" class="btn-retour" (click)="retour()" aria-label="Retour">
      <i class="ti ti-arrow-left" aria-hidden="true"></i> Retour
    </button>

    <div class="auth-toggle">
      <span class="toggle-option toggle-active">Connexion</span>
      <a routerLink="/creer-compte" class="toggle-option">Création de compte</a>
    </div>

    <h1>Connexion</h1>
    <p class="sous-titre">Accédez à votre espace membre</p>

    <form (ngSubmit)="connexion()" autocomplete="off">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" [(ngModel)]="formData.email" name="email" placeholder="votre@email.com" required autocomplete="off" />
      </div>

      <div class="form-group">
        <label for="motDePasse">Mot de passe</label>
        <input type="password" id="motDePasse" [(ngModel)]="formData.motDePasse" name="motDePasse" placeholder="••••••••" required autocomplete="new-password" />
      </div>

      @if (erreur()) {
        <div class="erreur-message">{{ erreur() }}</div>
      }

      <button type="submit" [disabled]="chargement()">
        @if (chargement()) {
          Connexion en cours...
        } @else {
          Se connecter
        }
      </button>
    </form>

  </div>
</div>
