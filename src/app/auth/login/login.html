<section class="login-container">

  <div class="login-card">

    <div class="login-header">
      <img src="assets/logo-box-removebg-preview.png" alt="Formation Academy" class="login-logo" />
      <h1>Espace Administrateur</h1>
      <p>Connectez-vous pour accéder au tableau de bord</p>
    </div>

    <form class="login-form" (ngSubmit)="seConnecter()">

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="formData.email"
          name="email"
          placeholder="admin&#64;formationacademy.bf"
          required
        />
      </div>

      <div class="form-group">
        <label for="motDePasse">Mot de passe</label>
        <div class="password-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="motDePasse"
            [(ngModel)]="formData.motDePasse"
            name="motDePasse"
            placeholder="Votre mot de passe"
            required
          />
          <span class="eye-icon" (click)="togglePassword()">
            {{ showPassword ? '🙈' : '👁️' }}
          </span>
        </div>
      </div>

      @if (erreur) {
        <div class="error-message">{{ erreur }}</div>
      }

      <button type="submit" class="btn-login" [disabled]="chargement">
        @if (chargement) {
          Connexion en cours...
        } @else {
          Se connecter
        }
      </button>

    </form>

  </div>

</section>
